# Push a version tag (npm version patch|minor|major && git push --follow-tags)
# and this tests the tagged commit, packs it and publishes a GitHub Release
# with the .tgz attached. `jevb update` installs from these releases.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm test
      - run: npm pack
      # Also attach a fixed-name copy, so one URL always installs the latest:
      # npm i -g https://github.com/<owner>/jevb/releases/latest/download/jevb.tgz
      - run: cp jevb-*.tgz jevb.tgz
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jevb-*.tgz jevb.tgz --title "$GITHUB_REF_NAME" --generate-notes
