# Push a version tag (npm version patch|minor|major && git push --follow-tags)
# and this tests the tagged commit, packs it and publishes a GitHub Release
# with the .tgz attached. `jevb update` installs from these releases.
name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npx playwright-core install --with-deps chromium-headless-shell
      - run: npm test
      - run: npm pack
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" jevb-*.tgz --title "$GITHUB_REF_NAME" --generate-notes
