<!doctype html><html><head><title>Fixture</title></head><body>
<nav><a href="#home">Home</a> <a href="#settings">Settings</a> <button aria-label="Notifications">🔔</button></nav>
<h1>Threads</h1>
<div id="list"></div>
<textarea placeholder="Write a reply..."></textarea>
<button id="post">Post reply</button>
<button onclick="document.body.dataset.x=1">Delete account</button>
<script>
document.getElementById('post').onclick = () => {
  const t = document.querySelector('textarea');
  const p = document.createElement('p'); p.textContent = 'Posted: ' + t.value; document.getElementById('list').append(p); t.value='';
}
</script></body></html>
